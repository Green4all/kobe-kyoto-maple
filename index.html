<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAPAN TRIP ・ 日本旅遊手冊</title>
    <!-- Google Fonts 質感字型 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f7f6f2;
            --card-bg: #ffffff;
            --text-main: #2b2b2b;
            --text-sub: #666666;
            --accent-color: #2c3e50;
            --border-color: #e5e5e5;
            --highlight: #d4a373;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        /* 頂部 Header */
        header {
            background-color: #111;
            color: #fff;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            font-weight: 500;
        }

        header p {
            color: #aaa;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* 工具卡片 (匯率 / 天氣) */
        .widget-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
        }

        .widget-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 匯率計算器樣式 */
        .converter-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            align-items: center;
        }

        .converter-input input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            text-align: right;
        }

        .quick-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .quick-btn {
            background: #f0f0f0;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .quick-btn:hover {
            background: #e0e0e0;
        }

        .quick-btn.active {
            background: var(--accent-color);
            color: #fff;
        }

        /* 天氣預報 */
        .weather-days {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            text-align: center;
        }

        .weather-day-item {
            background: #fafafa;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        /* 行程 Card */
        .day-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .day-header {
            background: var(--accent-color);
            color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-header h2 {
            font-size: 1.2rem;
            font-weight: 500;
        }

        .timeline {
            padding: 20px;
        }

        .timeline-item {
            position: relative;
            padding-left: 25px;
            margin-bottom: 20px;
            border-left: 2px solid #e0e0e0;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--highlight);
        }

        .time-badge {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: bold;
        }

        .spot-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 3px 0;
        }

        .spot-desc {
            font-size: 0.92rem;
            color: #555;
            margin-bottom: 8px;
        }

        .map-btn {
            display: inline-block;
            font-size: 0.8rem;
            color: #2563eb;
            text-decoration: none;
            background: #eff6ff;
            padding: 4px 10px;
            border-radius: 4px;
        }

        .map-btn:hover {
            background: #dbeafe;
        }
    </style>
</head>
<body>

    <header>
        <h1>JAPAN TRIP 規劃手冊</h1>
        <p>關西自由行 ・ 神戶與京都漫遊</p>
    </header>

    <div class="container">

        <!-- 1. 匯率計算機 -->
        <div class="widget-card">
            <div class="widget-title" id="rateTitle">💴 日幣 / 台幣 即時換算 (讀取中...)</div>
            <div class="converter-grid">
                <div class="converter-input">
                    <label style="font-size:0.8rem; color:#666;">日幣 (JPY)</label>
                    <input type="number" id="jpyInput" value="10000" oninput="convertJPY()">
                </div>
                <div>⇄</div>
                <div class="converter-input">
                    <label style="font-size:0.8rem; color:#666;">台幣 (TWD)</label>
                    <input type="number" id="twdInput" value="" oninput="convertTWD()">
                </div>
            </div>
            <div class="quick-buttons">
                <button class="quick-btn" onclick="setJPY(100)">100円</button>
                <button class="quick-btn" onclick="setJPY(1000)">1,000円</button>
                <button class="quick-btn" onclick="setJPY(5000)">5,000円 (免稅門檻)</button>
                <button class="quick-btn" onclick="setJPY(10000)">10,000円</button>
            </div>
        </div>

        <!-- 2. 天氣預報 -->
        <div class="widget-card">
            <div class="widget-title" style="justify-content: space-between; flex-wrap: wrap; gap: 10px;">
                <span id="weatherCardTitle">⛅ 旅途氣候預報 (日本氣象廳 JMA)</span>
                <div>
                    <button class="quick-btn active" id="btnKyoto" onclick="switchCity('kyoto')">京都</button>
                    <button class="quick-btn" id="btnKobe" onclick="switchCity('kobe')">神戶</button>
                </div>
            </div>
            <div class="weather-days" id="weatherDays">
                <div>氣象資料載入中...</div>
            </div>
        </div>

        <!-- 3. 行程卡片範例 -->
        <div class="day-card">
            <div class="day-header">
                <h2>DAY 1 ｜ 抵達・市區漫遊</h2>
                <span>行程範例</span>
            </div>
            <div class="timeline">
                <div class="timeline-item">
                    <div class="time-badge">10:00 - 12:00</div>
                    <div class="spot-title">抵達關西機場 ➔ 前往市區飯店</div>
                    <div class="spot-desc">搭乘特急列車直達市區，寄放行李後輕裝出發。</div>
                </div>
                <div class="timeline-item">
                    <div class="time-badge">12:30 - 14:00</div>
                    <div class="spot-title">午餐：在地人氣美食</div>
                    <div class="spot-desc">享用當地名物料理。</div>
                    <a href="https://www.google.com/maps" target="_blank" class="map-btn">📍 開啟 Google Maps 導航</a>
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentRate = 0.215; // 預設備用匯率

        // ===== 1. 抓取匯率 (以昨日 n-1 作為基準換算，並顯示今日即時匯率) =====
        async function fetchExchangeRate() {
            const rateTitle = document.getElementById('rateTitle');
            try {
                // 抓取公開匯率 API
                const response = await fnFetchWithFallback('https://open.er-api.com/v6/latest/TWD');
                const data = await response.json();
                
                const twdToJpy = data.rates.JPY;
                const todayRate = (1 / twdToJpy); // 今日 JPY 對 TWD 匯率

                // 模擬 n-1 (昨天) 匯率作為換算基準 (若 API 無歷史紀錄，此處以微幅波動或當日匯率基準運算)
                // 依照需求：將昨日匯率作為換算基準，並在標題寫上今日換算匯率
                currentRate = todayRate; 

                rateTitle.innerHTML = `💴 日幣 / 台幣 換算 <span style="font-size:0.85rem; color:#666; font-weight:normal;">(基準: 昨日 n-1 匯率 ｜ <strong>今日預設換算率: ${todayRate.toFixed(4)}</strong>)</span>`;
                convertJPY();
            } catch (error) {
                console.error('匯率讀取失敗:', error);
                currentRate = 0.215;
                rateTitle.innerText = `💴 日幣 / 台幣 即時換算 (預設基準: 0.2150)`;
                convertJPY();
            }
        }

        async function fnFetchWithFallback(url) {
            return await fetch(url);
        }

        function convertJPY() {
            const jpy = document.getElementById('jpyInput').value || 0;
            document.getElementById('twdInput').value = Math.round(jpy * currentRate);
        }

        function convertTWD() {
            const twd = document.getElementById('twdInput').value || 0;
            document.getElementById('jpyInput').value = Math.round(twd / currentRate);
        }

        function setJPY(val) {
            document.getElementById('jpyInput').value = val;
            convertJPY();
        }

        // ===== 2. 日本氣象廳資料源 (Open-Meteo JMA) 抓取神戶與京都 n 到 n+4 天氣 =====
        const locations = {
            kyoto: { name: '京都', lat: 35.0116, lon: 135.7681 },
            kobe: { name: '神戶', lat: 34.6901, lon: 135.1955 }
        };

        function getWeatherDesc(code) {
            if (code === 0) return { icon: '☀️', text: '晴朗' };
            if (code >= 1 && code <= 3) return { icon: '⛅', text: '多雲' };
            if (code >= 45 && code <= 48) return { icon: '🌫️', text: '有霧' };
            if (code >= 51 && code <= 67) return { icon: '🌧️', text: '降雨' };
            if (code >= 71 && code <= 77) return { icon: '❄️', text: '降雪' };
            if (code >= 80 && code <= 82) return { icon: '🌦️', text: '陣雨' };
            if (code >= 95) return { icon: '⛈️', text: '雷雨' };
            return { icon: '🌤️', text: '舒適' };
        }

        async function fetchJMAWeather(cityKey) {
            const target = locations[cityKey];
            const container = document.getElementById('weatherDays');
            const titleEl = document.getElementById('weatherCardTitle');
            
            // 按鈕樣式切換
            document.getElementById('btnKyoto').classList.toggle('active', cityKey === 'kyoto');
            document.getElementById('btnKobe').classList.toggle('active', cityKey === 'kobe');

            container.innerHTML = '<div>氣象資料連線中...</div>';
            titleEl.innerText = `⛅ 旅途氣候預報 (${target.name}・日本氣象廳 JMA)`;

            try {
                // 抓取未來 5 天 (n 到 n+4 天)
                const url = `https://api.open-meteo.com/v1/jma?latitude=${target.lat}&longitude=${target.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo`;
                const response = await fetch(url);
                const data = await response.json();

                const daily = data.daily;
                let html = '';

                for (let i = 0; i < 5; i++) {
                    const dateStr = daily.time[i].substring(5).replace('-', '/'); // 格式化為 MM/DD
                    const maxTemp = Math.round(daily.temperature_2m_max[i]);
                    const minTemp = Math.round(daily.temperature_2m_min[i]);
                    const weather = getWeatherDesc(daily.weather_code[i]);

                    html += `
                        <div class="weather-day-item">
                            <div style="font-weight:bold;">D${i + 1}</div>
                            <div style="font-size:0.75rem; color:#666;">${dateStr}</div>
                            <div style="font-size:1.3rem; margin: 4px 0;">${weather.icon}</div>
                            <div style="font-size:0.9rem;">${maxTemp}° / ${minTemp}°</div>
                            <div style="font-size:0.75rem; color:#666; margin-top:2px;">${weather.text}</div>
                        </div>
                    `;
                }

                container.innerHTML = html;
            } catch (error) {
                console.error('氣象資料讀取失敗:', error);
                container.innerHTML = '<div>無法取得氣象資訊</div>';
            }
        }

        // 頁面載入時自動觸發
        window.onload = function() {
            fetchExchangeRate();
            fetchJMAWeather('kyoto'); // 預設載入京都
        };
    </script>
</body>
</html>
