<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAPAN TRIP 2026 ・ 神戶京都旅遊手冊</title>
    <!-- Google Fonts 質感字型 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #FFB7C5;        /* 櫻花粉背景 */
            --card-bg: #FFFFFF;        /* 白底卡片 */
            --border-color: #c21f30;    /* 楓葉紅粗邊框 */
            --text-dark: #2C3E50;
            --text-sub: #7F8C8D;
            --accent-orange: #FF7675;
            --accent-blue: #74B9FF;
            --pill-bg: #F0F4F8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            padding: 20px 15px 60px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 頂部標題區 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }

        .title-group h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: 0.5px;
        }

        .title-group p {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        .pill-badge {
            background: #FFFFFF;
            border: 2px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            box-shadow: 0 2px 0 var(--border-color);
        }

        /* 萬用圓角白卡片 */
        .ui-card {
            background: var(--card-bg);
            border: 2.5px solid var(--border-color);
            border-radius: 24px;
            padding: 18px;
            box-shadow: 0 4px 12px rgba(44, 62, 80, 0.06);
        }

        /* Hero 卡片 (放圖片與標籤) */
        .hero-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hero-banner-box {
            position: relative;
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            background-color: #EBF3F5;
        }

        .hero-banner-box img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .tag-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .info-pill {
            flex: 1;
            min-width: 140px;
            background: #FFF;
            border: 2px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 0.82rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .info-pill.orange {
            background: #FFF5F5;
            color: #D63031;
            border-color: #FF7675;
        }

        .info-pill.blue {
            background: #F0F7FF;
            color: #0984E3;
            border-color: #74B9FF;
        }

        /* 卡片標題 Header */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #2ECC71;
            border-radius: 50%;
        }

        .city-switch-btns {
            display: flex;
            gap: 6px;
        }

        .city-btn {
            border: 2px solid var(--border-color);
            background: #FFF;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .city-btn.active {
            background: var(--border-color);
            color: #FFF;
        }

        /* 天氣 GRID */
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .weather-item {
            background: #FFF;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 10px 4px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .weather-item .day-tag {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .weather-item .icon {
            font-size: 1.4rem;
            margin: 2px 0;
        }

        .weather-item .temp {
            font-size: 0.78rem;
            font-weight: 700;
            color: #E17055;
        }

        .weather-item .desc {
            font-size: 0.7rem;
            color: var(--text-sub);
        }

        /* 穿搭 / 提醒 Tip Box */
        .tip-box {
            margin-top: 12px;
            background: #FFFDF0;
            border: 2px dashed #FDCB6E;
            border-radius: 14px;
            padding: 10px 12px;
            font-size: 0.82rem;
            color: #636E72;
            line-height: 1.45;
        }

        /* 匯率計算機 UI */
        .rate-badge {
            background: #F1F2F6;
            border: 1.5px solid #DFE4EA;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        .exchange-grid {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .currency-box {
            flex: 1;
            background: #FFF;
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 10px 12px;
        }

        .currency-label {
            font-size: 0.72rem;
            color: var(--text-sub);
            font-weight: 700;
            margin-bottom: 2px;
        }

        .currency-input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-dark);
            background: transparent;
        }

        .swap-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background: #EAF0F6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        .quick-rate-row {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .quick-rate-btn {
            flex: 1;
            white-space: nowrap;
            background: #FFF;
            border: 1.5px solid var(--border-color);
            padding: 5px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 頂部 Header -->
        <div class="top-bar">
            <div class="title-group">
                <h1>🍁Maple Story🍁 </h1>
                <p>Love Story in KOBE & KYOTO 2026 </p>
            </div>
            <div class="pill-badge">¥</div>
        </div>

        <!-- Hero 卡片 (含您上傳的圖片 footer-img.jpg 與標籤) -->
        <div class="ui-card hero-card">
            <div class="hero-banner-box">
                <img src="footer-img.jpg" alt="Kansai Trip Illustration">
            </div>
            <div class="tag-row">
                <div class="info-pill blue" onclick="openFlightModal()" style="cursor: pointer;" title="點擊檢視機票截圖">✈️ JX1834 11:45 (KOBE) 🔍</div>
                <div class="info-pill orange">🏨 神戶膠囊 & 京都美宅</div>
            </div>
        </div>

        <!-- 氣象卡片 (日本氣象廳 JMA 數據) -->
        <div class="ui-card">
            <div class="card-header">
                <div class="card-title">
                    <span>⛅ <span id="cityNameTitle">京都</span>即時氣候</span>
                    <span class="status-dot" title="API 已連線"></span>
                </div>
                <div class="city-switch-btns">
                    <button class="city-btn active" id="btnKyoto" onclick="fetchJMAWeather('kyoto')">京都</button>
                    <button class="city-btn" id="btnKobe" onclick="fetchJMAWeather('kobe')">神戶</button>
                </div>
            </div>

            <!-- 未來 5 天氣象 (D1~D5) -->
            <div class="weather-grid" id="weatherGrid">
                <div>載入中...</div>
            </div>

            <div class="tip-box">
                💡 <strong>穿搭與旅途叮嚀：</strong> 建議採取多層次穿搭（洋蔥式穿法），早晚溫差較大，外出請隨身攜帶薄外套或防風外套與摺疊傘！
            </div>
        </div>

        <!-- 匯率卡片 (即時匯率) -->
        <div class="ui-card">
            <div class="card-header">
                <div class="card-title">
                    <span>¥ 台幣・日幣 即時快速換算</span>
                </div>
                <div class="rate-badge" id="rateBadge">1 JPY ≈ ... TWD</div>
            </div>

            <div class="exchange-grid">
                <div class="currency-box">
                    <div class="currency-label">日幣 (JPY)</div>
                    <input type="number" id="jpyInput" class="currency-input" value="1000" oninput="convertJPY()">
                </div>
                <div class="swap-icon">⇄</div>
                <div class="currency-box">
                    <div class="currency-label">台幣 (TWD)</div>
                    <input type="number" id="twdInput" class="currency-input" value="" oninput="convertTWD()">
                </div>
            </div>

            <div class="quick-rate-row">
                <button class="quick-rate-btn" onclick="setJPY(100)">100円 (百圓店)</button>
                <button class="quick-rate-btn" onclick="setJPY(1000)">1,000円</button>
                <button class="quick-rate-btn" onclick="setJPY(5000)">5,000円 (免稅)</button>
                <button class="quick-rate-btn" onclick="setJPY(10000)">10,000円</button>
            </div>
        </div>

    </div>

    <script>
        let currentRate = 0.2063; // 預備匯率

        // 1. 抓取公開匯率
        async function fetchExchangeRate() {
            const badge = document.getElementById('rateBadge');
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/TWD');
                const data = await response.json();
                
                const twdToJpy = data.rates.JPY;
                currentRate = (1 / twdToJpy); 

                badge.innerText = `1 JPY ≈ ${currentRate.toFixed(4)} TWD`;
                convertJPY();
            } catch (error) {
                console.error('匯率讀取失敗:', error);
                badge.innerText = `匯率: ${currentRate.toFixed(4)}`;
                convertJPY();
            }
        }

        function convertJPY() {
            const jpy = document.getElementById('jpyInput').value || 0;
            document.getElementById('twdInput').value = Math.round(jpy * currentRate);
        }

        function convertTWD() {
            const twd = document.getElementById('twdInput').value || 0;
            document.getElementById('jpyInput').value = Math.round(twd / currentRate);
        }

        function setJPY(val) {
            document.getElementById('jpyInput').value = val;
            convertJPY();
        }

        // 2. 氣象 API (Open-Meteo JMA)
        const locations = {
            kyoto: { name: '京都', lat: 35.0116, lon: 135.7681 },
            kobe: { name: '神戶', lat: 34.6901, lon: 135.1955 }
        };

        function getWeatherDesc(code) {
            if (code === 0) return { icon: '☀️', text: '晴朗' };
            if (code >= 1 && code <= 3) return { icon: '⛅', text: '多雲' };
            if (code >= 45 && code <= 48) return { icon: '🌫️', text: '有霧' };
            if (code >= 51 && code <= 67) return { icon: '🌧️', text: '降雨' };
            if (code >= 71 && code <= 77) return { icon: '❄️', text: '降雪' };
            if (code >= 80 && code <= 82) return { icon: '🌦️', text: '陣雨' };
            if (code >= 95) return { icon: '⛈️', text: '雷雨' };
            return { icon: '🌤️', text: '舒適' };
        }

        async function fetchJMAWeather(cityKey) {
            const target = locations[cityKey];
            const grid = document.getElementById('weatherGrid');
            document.getElementById('cityNameTitle').innerText = target.name;
            
            document.getElementById('btnKyoto').classList.toggle('active', cityKey === 'kyoto');
            document.getElementById('btnKobe').classList.toggle('active', cityKey === 'kobe');

            grid.innerHTML = '<div style="grid-column: span 5; text-align:center;">資料連線中...</div>';

            try {
                const url = `https://api.open-meteo.com/v1/jma?latitude=${target.lat}&longitude=${target.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo`;
                const response = await fetch(url);
                const data = await response.json();

                const daily = data.daily;
                let html = '';

                for (let i = 0; i < 5; i++) {
                    const dateStr = daily.time[i].substring(5).replace('-', '/'); 
                    const maxTemp = Math.round(daily.temperature_2m_max[i]);
                    const minTemp = Math.round(daily.temperature_2m_min[i]);
                    const weather = getWeatherDesc(daily.weather_code[i]);

                    html += `
                        <div class="weather-item">
                            <div class="day-tag">D${i + 1} ${dateStr}</div>
                            <div class="icon">${weather.icon}</div>
                            <div class="temp">${maxTemp}° / ${minTemp}°</div>
                            <div class="desc">${weather.text}</div>
                        </div>
                    `;
                }

                grid.innerHTML = html;
            } catch (error) {
                console.error('氣象讀取失敗:', error);
                grid.innerHTML = '<div style="grid-column: span 5; text-align:center;">氣象連線失敗</div>';
            }
        }

        window.onload = function() {
            fetchExchangeRate();
            fetchJMAWeather('kyoto');
        };
    
// 開啟機票截圖視窗
        function openFlightModal() {
            document.getElementById('flightModal').style.display = 'flex';
        }

        // 關閉機票截圖視窗
        function closeFlightModal() {
            document.getElementById('flightModal').style.display = 'none';
        }
        </script>
<!-- 機票截圖彈跳視窗 Modal -->
    <div id="flightModal" style="display: none; position: fixed; top: 0; left: 0; width: 200%; height: 200%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 20px;" onclick="closeFlightModal()">
        <div style="background: #fff; padding: 15px; border-radius: 16px; max-width: 500px; width: 100%; position: relative; border: 3px solid #c21f30;" onclick="event.stopPropagation()">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3 style="font-size: 1rem; color: #2C3E50;">✈️ flight-ticket-info </h3>
                <button onclick="closeFlightModal()" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; font-weight: bold;">✕</button>
            </div>
            <!-- 您的機票圖片檔案名稱，請確保檔名正確 (例如 flight-ticket.jpg) -->
            <img src="green_kobe_flight-ticket.jpg" alt="Flight Ticket" style="width: 200%; height: auto; border-radius: 8px; border: 1px solid #ddd;">
        </div>
    </div>
</body>
</html>
